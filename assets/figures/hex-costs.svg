<title id="title">CPU 워커 수에 따른 실행 비용</title>
<desc id="desc">같은 11×11 비종료 보드에서 수당 총 16,000회 탐색을 수행했습니다. 로컬 Windows 16 논리 CPU는 워커별 7회, Kaggle Linux 4 vCPU는 5회 반복했습니다. 응답 지연의 중앙값과 95백분위, 외부 측정 처리량과 최대 프로세스 RSS입니다. 단일 보드 측정이며 승률이 아닙니다.</desc>
