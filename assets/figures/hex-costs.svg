<text x="74" y="930" fill="#66717A" font-size="22" font-weight="400" text-anchor="start">Kaggle의 CPU 할당은 4 vCPU입니다. 8워커로 실행해도 CPU 할당이 8개로 늘어나지 않습니다.</text>
<text x="74" y="962" fill="#66717A" font-size="22" font-weight="400" text-anchor="start">처리량은 응답 시간 기준입니다. RSS는 네이티브 전체 워커를 포함하며 Python 실행기는 제외합니다.</text>
<text x="48" y="1031" fill="#66717A" font-size="20" font-weight="400" text-anchor="start">서로 다른 장비의 시간으로 개선율을 계산하지 않습니다. 단일 보드의 비용 측정이며 대국 성능과 구분합니다.</text>
<text x="48" y="1060" fill="#66717A" font-size="20" font-weight="400" text-anchor="start">각 패널의 시간 축 범위가 다릅니다. 막대는 중앙값, 위쪽 표시는 p95이며 작은 반복 표본의 관측치입니다.</text>
