<text x="74" y="801" fill="#64696B" font-size="23" font-weight="400" text-anchor="start">k = 3,000 후보는 점수 75%였지만 구간 하한이 50%여서 기본 k = 1,000을 유지했습니다.</text>
<text x="48" y="880" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">통계 정확성 수정은 이 채택 기준으로 되돌리는 항목이 아닙니다. 개발 결과와 최종 평가를 구분합니다.</text>
