<title id="title">선택 가능한 설정 후보의 개발 평가</title>
<desc id="desc">RAVE-TS의 브리지 제거, 수 정렬 제거, RAVE k 300 및 3000 후보를 기본 설정과 각각 16경기, 8개 교대 쌍으로 비교했습니다. 모든 후보가 사전 채택 기준을 통과하지 못해 기본 설정을 유지했습니다.</desc>
