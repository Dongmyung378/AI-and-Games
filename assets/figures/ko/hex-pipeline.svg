<text x="73" y="649" fill="#17304A" font-size="29" font-weight="750" text-anchor="start">CPU 예산과 실패를 함께 관리</text>
<text x="73" y="689" fill="#66717A" font-size="22" font-weight="400" text-anchor="start">전체 탐색 횟수는 워커 전체의 합계입니다. 노드와 트리 예산과 실제 프로세스 RSS를 구분합니다.</text>
<text x="73" y="720" fill="#66717A" font-size="22" font-weight="400" text-anchor="start">스왑 이후에도 매 요청의 현재 색상을 전달하고, 시간 초과와 실행 오류를 승리로 계산하지 않습니다.</text>
<text x="48" y="810" fill="#66717A" font-size="20" font-weight="400" text-anchor="start">구조 설명입니다. 특정 정책의 승률이나 외부 상대에 대한 우위를 뜻하지 않습니다.</text>
