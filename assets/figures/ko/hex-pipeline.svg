<title id="title">Hex의 탐색과 평가 파이프라인</title>
<desc id="desc">보드 상태와 합법 수를 전달해 독립 워커가 탐색하고 루트 통계를 합칩니다. 좌표를 검증한 경기 기록은 재생한 뒤 선후공 교대 쌍으로 집계합니다.</desc>
