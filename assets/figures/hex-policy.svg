<title id="title">개발 정책의 균형 비교</title>
<desc id="desc">같은 엔진에서 네 정책을 각 48경기씩 비교했습니다. 96개 실제 경기에 두 정책이 참가하므로 정책별 분모 합은 192입니다. 완료 경기 점수로 RAVE-TS를 선택했고 새로운 시드의 최종 평가에서는 재선택하지 않습니다.</desc>
