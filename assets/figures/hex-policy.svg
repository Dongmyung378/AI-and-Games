<text x="48" y="64" fill="#173B35" font-size="36" font-weight="750" text-anchor="start">개발 비교로 정책을 선택하고 고정</text>
<text x="48" y="106" fill="#64696B" font-size="22" font-weight="400" text-anchor="start">동일 C++ 엔진 · 수당 전체 4,000회 · 워커 2개 · 96경기, 48개 선후공 교대 쌍</text>
<text x="48" y="159" fill="#173B35" font-size="25" font-weight="700" text-anchor="start">세 내부 상대에 대한 완료 경기 점수</text>
