<title id="title">새 시드의 최종 정책 평가</title>
<desc id="desc">개발 자료로 고정한 RAVE-TS를 세 정책과 통계 미갱신 진단용 제어에 비교합니다. 완결된 선후공 교대 쌍의 점수와 95% 부트스트랩 구간 및 완료 경기의 승패를 표시합니다. 실패는 승리로 계산하지 않습니다. 내부 상대와 명시한 CPU 예산 범위의 결과입니다.</desc>
