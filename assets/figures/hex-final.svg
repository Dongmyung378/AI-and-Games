<text x="48" y="1033" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">점수와 구간은 완결된 교대 쌍, 승패는 완료 경기 기준입니다. 실패를 승리로 계산하지 않습니다.</text>
<text x="48" y="1062" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">모든 쌍에서 승리해 100–100% 구간이 나와도 앞으로의 100% 승리를 보장하지 않습니다.</text>
<text x="48" y="1091" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">통계 미갱신 제어는 같은 수정 엔진의 진단 조건입니다. 실제 과거 실행 파일과 별도 시간 기준 비교를 구분합니다.</text>
<text x="48" y="1120" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">외부 Davis·HexHex의 승률이나 전체 Hex 에이전트 순위를 뜻하지 않습니다. 새로운 시드는 새 시작 좌표를 보장하지 않습니다.</text>
