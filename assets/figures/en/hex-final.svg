<text x="48" y="1033" fill="#66717A" font-size="20" font-weight="400" text-anchor="start">Scores and intervals use complete alternating pairs; wins/losses use completed games. Failures are not wins.</text>
<text x="48" y="1062" fill="#66717A" font-size="20" font-weight="400" text-anchor="start">A 100–100% interval after winning every pair does not guarantee 100% future wins.</text>
<text x="48" y="1091" fill="#66717A" font-size="20" font-weight="400" text-anchor="start">The control disables updates in the same corrected engine; original binaries and separate time budgets differ.</text>
<text x="48" y="1120" fill="#66717A" font-size="20" font-weight="400" text-anchor="start">Not Davis/HexHex win rates or an overall Hex ranking. New seeds may reuse opening coordinates.</text>
