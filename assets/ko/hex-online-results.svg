<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
<title id="title">온라인 공개 봇 실전 검증 및 MoHex 3 선공 돌파 과정</title>
<desc id="desc">Davis 7, Davis 10 전승 및 MoHex 3 후공·선공 승리 스코어카드와 두 차례 선공 진단 패배를 v1.2 완승으로 돌파한 반복 개선 루프입니다.</desc>
<style>text{font-family:'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:'JetBrains Mono', Consolas, 'Courier New', monospace}</style>
