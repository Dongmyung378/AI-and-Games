<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="title desc">
<title id="title">단계별 실증 Elo 진화 (v0.0 → v1.2) 및 기각된 8가지 가설</title>
<desc id="desc">이전 고정 체크포인트 대비 선·후공 교대 통제 대국으로 검증된 누적 +342 Elo 상승과 50% 미만으로 기각·원복된 8가지 가설 비교 차트입니다.</desc>
