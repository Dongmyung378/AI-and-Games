name: CI (Hex-Search v1.2.0)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build C++17 engine and run exhaustive --self-test
        run: python -m hexai build
      - name: Run unit, protocol, Pondering, GUI, and SGF/JSON battle replay tests
        run: python -m unittest discover -s tests -v
      - name: Verify reproducible figure generation
        run: python scripts/generate_figures.py --check
      - name: Run AddressSanitizer + UBSan check on Linux
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          g++ -std=c++17 -O1 -g -pthread -fsanitize=address,undefined native/hex_search.cpp -o /tmp/hex_search_san
          /tmp/hex_search_san --self-test
