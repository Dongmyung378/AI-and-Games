name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-engine:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run game-engine tests
        run: python -m unittest discover -s test -v
